          <div class="brand-meta">
            <h1>Sunflower Tools</h1>
            <p class="code-release" id="code-release" title="Thời điểm phát hành phiên bản hiện tại">--/--/---- · --:--</p>
          </div>
          <div class="header-actions">
            <p class="connection is-disconnected" id="connection-status"><span></span> Chưa kết nối Sunflower Land</p>
            <button class="header-icon-button" id="open-settings" type="button" title="Cài đặt" aria-label="Mở cài đặt">⚙</button>
            <button class="reload-extension-button" id="reload-extension" type="button" title="Reload extension" aria-label="Reload extension">↻</button>
          </div>
        </div>
      </header>

      <main class="extension-content" id="extension-content" aria-label="Extension content">
        <section class="connection-empty-state" id="disconnected-content">
          <div><span class="connection-empty-icon" aria-hidden="true">🌻</span><h2>Kết nối Sunflower Land</h2><p>Mở game rồi kết nối để dùng các công cụ.</p><button class="connect-button" id="connect-button" type="button">Kết nối</button></div>
        </section>
        <div id="connected-content" hidden>
        <section class="tool-tab-panel" id="map-panel" data-tool-panel="map">
          <div class="map-sticky-controls">
            <div class="map-summary">
              <div class="land-info" id="land-info" aria-live="polite">Đang đọc thông tin land…</div>
            </div>
            <div class="map-scan-card"><div class="test-actions"><button class="scan-map-button" id="scan-map" type="button" title="Quét Map" aria-label="Quét Map"><span class="scan-icon" aria-hidden="true">⟳</span><span>Map</span></button><button class="scan-map-button" id="scan-fertilisers" type="button" title="Quét túi đồ" aria-label="Quét túi đồ"><span class="scan-icon" aria-hidden="true">⟳</span><span>Túi</span></button></div></div>
          </div>
          <section class="map-tools">
            <nav class="map-activity-tabs" role="tablist" aria-label="Nghề trên Map"><button class="map-activity-tab is-active" type="button" role="tab" aria-selected="true" data-map-activity-tab="overview">Tổng quan</button><button class="map-activity-tab" type="button" role="tab" aria-selected="false" data-map-activity-tab="market">Betty Market</button><button class="map-activity-tab" type="button" role="tab" aria-selected="false" data-map-activity-tab="workbench">Workbench</button><button class="map-activity-tab" type="button" role="tab" aria-selected="false" data-map-activity-tab="seeds" hidden>Hạt</button></nav>
            <div class="map-activity-content" id="map-activity-content">
              <div class="activity-results" id="ready-results"><div class="tree-results" id="overview-results"><div class="empty-state" data-activity="overview">Chưa quét map.</div></div><div class="crop-results" id="crop-results"><div class="empty-state">Chưa quét map.</div></div><div class="tree-results" id="tree-results"></div><div class="tree-results" id="mining-results"></div></div>
              <div class="activity-results activity-results-growing" id="growing-results"><div class="crop-results" id="crop-growing-results"></div><div class="tree-results" id="tree-growing-results"></div><div class="tree-results" id="mining-growing-results"></div></div>
              <section class="market-tab-content" id="market-tab-content" hidden><div class="tab-scan-action"><button class="scan-map-button" id="scan-betty" type="button"><span class="scan-icon" aria-hidden="true">⟳</span><span>Quét Betty</span></button></div><div class="shop-results map-betty-results" id="shop-results"></div></section>
              <section class="workbench-tab-content" id="workbench-tab-content" hidden><div class="tab-scan-action"><button class="scan-map-button" id="scan-tools" type="button"><span class="scan-icon" aria-hidden="true">⟳</span><span>Quét Tools</span></button></div><div class="shop-results map-workbench-results" id="workbench-results"></div></section>
              <section class="activity-group seed-picker-panel" data-activity="seeds" hidden><div class="seed-picker-results" id="seed-picker-results"></div></section>
              <div class="activity-results activity-results-blocked" id="blocked-results"></div>
            </div>
          </section>
        </section>
        <section class="tool-tab-panel settings-panel" data-tool-panel="settings" hidden>
          <div class="settings-header"><button id="close-settings" type="button" class="settings-back-button">← Quay lại</button><h2>Cài đặt</h2></div>
          <label class="settings-toggle"><span><b>Thông báo sẵn sàng</b><small>Báo khi tiến trình đếm ngược hoàn tất. Bật lên để nhận thông báo thử.</small><small id="notification-status" class="notification-status"></small></span><input id="ready-notifications" type="checkbox" role="switch" /><i aria-hidden="true"></i></label>
          <label class="settings-toggle"><span><b>Chấm tròn khi hover</b><small>Hiển thị các chấm tròn trên map khi rê chuột qua card có vị trí tương ứng.</small></span><input id="map-hover-highlights" type="checkbox" role="switch" /><i aria-hidden="true"></i></label>
        </section>
        </div>
      </main>
      <section class="persistent-log" aria-label="Nhật ký hoạt động">
        <div class="persistent-log-heading"><h2>Nhật ký</h2><span>Hoạt động mới nhất</span></div>
        <div class="panel-log" id="panel-log" aria-live="polite"></div>
      </section>
      <footer class="app-footer"><span id="site-label">Mở sunflower-land.com để kết nối</span></footer>
    </div>
    <!-- Shared helpers and feature renderers load before the app coordinator. -->
    <script src="core/ui-utils.js"></script>
    <script src="core/connection.js"></script>
    <script src="features/renderers/market-ui.js"></script>
    <script src="features/renderers/workbench-view.js"></script>
    <script src="sidepanel.js"></script>
    <script src="features/schedulers/ready-notifications.js"></script>
    <script src="features/schedulers/pet-scheduler.js"></script>
    <script src="features/state/composter-state.js"></script>
    <script src="features/state/resource-state.js"></script>
    <script src="features/state/tree-state.js"></script>
    <script src="features/schedulers/countdown-controller.js"></script>
    <script src="features/state/seed-inventory.js"></script>
    <script src="features/state/profession-scan-state.js"></script>
    <script src="features/navigation/tabs.js"></script>
    <script src="features/actions/npc-minigame-actions.js"></script>
    <script src="features/actions/connection-actions.js"></script>
    <script src="features/scanners/inventory-scanner.js"></script>
    <script src="features/scanners/map-scanner.js"></script>
    <script src="features/cards/crop-cards.js"></script>
    <script src="features/cards/resource-cards.js"></script>
    <script src="features/cards/fruit-cards.js"></script>
    <script src="features/renderers/map-renderers.js"></script>
    <script src="features/renderers/overview-renderer.js"></script>
    <script src="features/scanners/map-dom-scanner.js"></script>
    <script src="features/actions/market-actions.js"></script>
    <script src="features/actions/resource-actions.js"></script>
    <script src="features/actions/crop-harvest-actions.js"></script>
    <script src="features/actions/farm-actions.js"></script>
    <script src="features/actions/overview-actions.js"></script>
    <script src="features/actions/map-card-highlight.js"></script>
    <script src="features/actions/market-tab-lifecycle.js"></script>
    <script src="bootstrap.js"></script>
  </body>
</html>
